<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mise</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; min-width: 0; overflow: hidden; }
    body {
      margin: 0;
      color: var(--openidea-fg);
      background: transparent;
      font: var(--openidea-font-size) var(--openidea-font-ui);
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--openidea-border) transparent;
    }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track, *::-webkit-scrollbar-corner { background: transparent; }
    *::-webkit-scrollbar-thumb {
      min-height: 28px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: var(--openidea-border);
      background-clip: padding-box;
    }
    *::-webkit-scrollbar-thumb:hover { background-color: var(--openidea-fg-muted); }
    button, input { font: inherit; }
    .shell {
      display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
      width: 100%; height: 100vh; min-width: 0; overflow: hidden;
    }
    .refresh, .run, .reveal, .trust-action {
      border: 1px solid var(--openidea-border); border-radius: 5px;
      background: var(--openidea-bg-elevated); color: var(--openidea-fg);
      padding: 4px 9px; cursor: pointer;
    }
    .refresh:hover, .run:hover, .reveal:hover, .trust-action:hover { background: var(--openidea-bg-hover); }
    .refresh:focus-visible, .run:focus-visible, .reveal:focus-visible, .trust-action:focus-visible, input:focus-visible {
      outline: 2px solid var(--openidea-focus-ring); outline-offset: 1px;
    }
    button:disabled { cursor: default; opacity: .6; }
    .tabs {
      display: flex; align-items: center; gap: 2px;
      min-height: var(--openidea-corner-inset-height, 0);
      padding: 6px calc(10px + var(--openidea-corner-inset-width, 0px)) 0 10px;
      border-bottom: 1px solid var(--openidea-border);
    }
    .tab {
      border: 0; border-bottom: 2px solid transparent; background: transparent;
      color: var(--openidea-fg-muted); padding: 6px 10px; cursor: pointer;
    }
    .tab.active { color: var(--openidea-fg-strong); border-bottom-color: var(--openidea-accent); }
    .tabs-spacer { flex: 1; }
    .refresh { margin: 0 0 5px 8px; padding: 3px 8px; }
    .content { min-width: 0; min-height: 0; overflow: auto; padding: 10px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
    input {
      min-width: 180px; width: min(420px, 100%); padding: 5px 8px;
      border: 1px solid var(--openidea-border); border-radius: 5px;
      color: var(--openidea-fg); background: var(--openidea-bg-input);
    }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { position: sticky; top: -10px; background: var(--openidea-bg); color: var(--openidea-fg-muted); text-align: left; }
    th, td { padding: 7px 8px; border-bottom: 1px solid var(--openidea-border); vertical-align: top; }
    tr:hover td { background: var(--openidea-bg-hover); }
    .name { color: var(--openidea-fg-strong); font-family: var(--openidea-font-mono); overflow-wrap: anywhere; }
    .detail { color: var(--openidea-fg-muted); overflow-wrap: anywhere; }
    .status-ok { color: var(--openidea-success); }
    .status-off { color: var(--openidea-fg-muted); }
    .tool-groups { display: grid; gap: 12px; }
    .tool-group {
      min-width: 0; overflow: hidden;
      border: 1px solid var(--openidea-border); border-radius: 6px;
      background: var(--openidea-bg);
    }
    .tool-group-header {
      display: flex; align-items: center; gap: 8px; min-width: 0;
      padding: 7px 8px; border-bottom: 1px solid var(--openidea-border);
      background: var(--openidea-bg-elevated);
    }
    .tool-group-source { min-width: 0; flex: 1; }
    .tool-group-title { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .tool-group-path {
      margin-top: 2px; color: var(--openidea-fg-muted);
      font-family: var(--openidea-font-mono); overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .tool-group-count { color: var(--openidea-fg-muted); white-space: nowrap; }
    .scope-badge, .tier-badge {
      display: inline-block; padding: 1px 6px; border-radius: 9px;
      color: var(--openidea-fg-muted); background: var(--openidea-bg);
      border: 1px solid var(--openidea-border); font-size: .9em;
    }
    .scope-badge.project, .scope-badge.nested { color: var(--openidea-accent); }
    .scope-badge.global { color: var(--openidea-success); }
    .scope-badge.system { color: var(--openidea-warning); }
    .tool-group table th { top: -10px; }
    .tool-group table tr:last-child td { border-bottom: 0; }
    .errors { display: grid; gap: 6px; padding: 8px 10px; }
    .error {
      border-left: 3px solid var(--openidea-warning); background: var(--openidea-bg-elevated);
      color: var(--openidea-fg); padding: 7px 9px;
    }
    .trust-prompt {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      border-left: 3px solid var(--openidea-warning); background: var(--openidea-bg-elevated);
      color: var(--openidea-fg); padding: 9px 10px;
    }
    .trust-copy { flex: 1 1 360px; }
    .trust-copy strong { display: block; margin-bottom: 3px; color: var(--openidea-fg-strong); }
    .trust-actions { display: flex; gap: 7px; }
    .trust-action.primary {
      border-color: var(--openidea-accent);
      background: var(--openidea-accent);
      color: var(--openidea-fg-on-accent);
    }
    .empty { color: var(--openidea-fg-muted); padding: 20px 8px; text-align: center; }
    .footer { border-top: 1px solid var(--openidea-border); padding: 5px 10px; color: var(--openidea-fg-muted); }
    .hidden { display: none !important; }
    .pill {
      display: inline-block; margin: 1px 4px 1px 0; padding: 1px 5px; border-radius: 9px;
      background: var(--openidea-bg-elevated); color: var(--openidea-fg-muted);
    }
    .graph-summary, .graph-legend {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 9px;
      color: var(--openidea-fg-muted);
    }
    .graph-summary .problem { color: var(--openidea-warning); }
    .graph-viewport {
      min-height: 260px; overflow: auto; border: 1px solid var(--openidea-border);
      border-radius: 6px; background: var(--openidea-bg);
    }
    .graph-viewport svg { display: block; min-width: 100%; }
    .graph-edge { fill: none; stroke-width: 1.7; opacity: .8; }
    .graph-edge.depends { stroke: var(--openidea-accent); }
    .graph-edge.depends-post { stroke: var(--openidea-success); stroke-dasharray: 7 4; }
    .graph-edge.wait-for { stroke: var(--openidea-warning); stroke-dasharray: 2 4; }
    .graph-edge.missing { stroke: var(--openidea-error, #d94b4b); stroke-width: 2; }
    .marker-depends { fill: var(--openidea-accent); }
    .marker-depends-post { fill: var(--openidea-success); }
    .marker-wait-for { fill: var(--openidea-warning); }
    .marker-missing { fill: var(--openidea-error, #d94b4b); }
    .graph-node { cursor: pointer; outline: none; }
    .graph-node rect {
      fill: var(--openidea-bg-elevated); stroke: var(--openidea-border); stroke-width: 1.2;
    }
    .graph-node:hover rect, .graph-node:focus-visible rect { stroke: var(--openidea-accent); stroke-width: 2; }
    .graph-node.selected rect { stroke: var(--openidea-accent); stroke-width: 2.4; }
    .graph-node.cyclic rect { stroke: var(--openidea-warning); }
    .graph-node.missing rect { fill: transparent; stroke: var(--openidea-error, #d94b4b); stroke-dasharray: 5 4; }
    .graph-node-name { fill: var(--openidea-fg-strong); font-family: var(--openidea-font-mono); font-size: 12px; }
    .graph-node-detail { fill: var(--openidea-fg-muted); font-size: 11px; }
    .graph-run { cursor: pointer; }
    .graph-run circle { fill: var(--openidea-accent); }
    .graph-run path { fill: var(--openidea-bg); }
    .graph-details {
      display: grid; grid-template-columns: minmax(160px, 1fr) minmax(240px, 2fr) auto;
      gap: 14px; align-items: start; margin-top: 10px; padding: 10px;
      border: 1px solid var(--openidea-border); border-radius: 6px;
      background: var(--openidea-bg-elevated);
    }
    .graph-details h3 { margin: 0 0 5px; font: 600 1em var(--openidea-font-mono); }
    .graph-relations { display: grid; gap: 5px; }
    .graph-relation {
      display: flex; align-items: center; gap: 7px; color: var(--openidea-fg-muted);
    }
    .graph-relation button {
      border: 0; padding: 0; background: transparent; color: var(--openidea-accent);
      cursor: pointer; font: inherit;
    }
    .edge-swatch { width: 22px; height: 0; border-top: 2px solid var(--openidea-accent); }
    .edge-swatch.depends-post { border-color: var(--openidea-success); border-top-style: dashed; }
    .edge-swatch.wait-for { border-color: var(--openidea-warning); border-top-style: dotted; }
    .edge-swatch.missing { border-color: var(--openidea-error, #d94b4b); }
    @media (max-width: 720px) {
      .graph-details { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
  <main class="shell">
    <nav class="tabs" aria-label="Mise sections">
      <button class="tab active" data-tab="tasks" type="button">Tasks <span id="task-count"></span></button>
      <button class="tab" data-tab="graph" type="button">Graph</button>
      <button class="tab" data-tab="tools" type="button">Tools <span id="tool-count"></span></button>
      <button class="tab" data-tab="configuration" type="button">Configuration <span id="config-count"></span></button>
      <button class="tab" data-tab="environment" type="button">Environment <span id="env-count"></span></button>
      <span class="tabs-spacer"></span>
      <button id="refresh" class="refresh" type="button">Refresh</button>
    </nav>
    <section class="content">
      <div id="search-bar" class="toolbar"><input id="search" type="search" placeholder="Filter tasks"></div>
      <div id="tasks"></div>
      <div id="graph" class="hidden"></div>
      <div id="tools" class="hidden"></div>
      <div id="configuration" class="hidden"></div>
      <div id="environment" class="hidden"></div>
    </section>
    <div>
      <div id="errors" class="errors"></div>
      <footer id="footer" class="footer">Loading Mise data…</footer>
    </div>
  </main>
  <script>
    (() => {
      "use strict";
      let state = {};
      let activeTab = "tasks";
      let selectedGraphTask = null;
      let timer = null;
      let bridge = null;
      let trustDismissed = false;
      let latestRequestId = 0;
      const sessionId = `mise-${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
      const byId = id => document.getElementById(id);
      const text = value => value == null ? "" : String(value);
      const make = (tag, className, value) => {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (value != null) element.textContent = text(value);
        return element;
      };
      const errorText = error => {
        if (error && typeof error === "object" && "message" in error) return text(error.message);
        return text(error) || "Unknown error";
      };
      const showFatal = error => {
        const message = `Mise view error: ${errorText(error)}`;
        const errors = byId("errors");
        const footer = byId("footer");
        if (errors) errors.replaceChildren(make("div", "error", message));
        if (footer) footer.textContent = message;
      };
      window.addEventListener("error", event => showFatal(event.error || event.message));
      window.addEventListener("unhandledrejection", event => showFatal(event.reason));
      byId("footer").textContent = "Loading Mise data…";
      const send = value => {
        if (!bridge || typeof bridge.postMessage !== "function") {
          throw new Error("OpenIDEA message bridge is unavailable");
        }
        bridge.postMessage(JSON.stringify({...value, sessionId}));
      };
      const requestSnapshot = (op, showLoading = false) => {
        if (state.loading) return;
        const requestId = ++latestRequestId;
        state = {...state, loading: true};
        if (showLoading) {
          render();
        }
        send({op, requestId});
      };
      const normalizeState = value => {
        const source = value && typeof value === "object" ? value : {};
        const list = candidate => Array.isArray(candidate) ? candidate : [];
        const graph = source.graph && typeof source.graph === "object" ? source.graph : {};
        return {
          op: "snapshot",
          project: text(source.project),
          context: text(source.context || source.project),
          tasks: list(source.tasks),
          graph: {
            nodes: list(graph.nodes),
            edges: list(graph.edges),
            cycles: list(graph.cycles),
            missing: list(graph.missing)
          },
          tools: list(source.tools),
          configs: list(source.configs),
          environment: list(source.environment),
          errors: list(source.errors).map(text),
          trustRequired: Boolean(source.trustRequired),
          autoRefreshSeconds: Number(source.autoRefreshSeconds || 0),
          loading: Boolean(source.loading)
        };
      };
      const makeSvg = (tag, attributes = {}) => {
        const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
        Object.entries(attributes).forEach(([name, value]) => element.setAttribute(name, text(value)));
        return element;
      };
      const short = (value, limit) => {
        const result = text(value);
        return result.length > limit ? `${result.slice(0, Math.max(0, limit - 1))}…` : result;
      };
      const sourceName = source => {
        const normalized = text(source).replaceAll("\\", "/");
        return normalized.split("/").pop() || normalized;
      };
      const normalizePath = value => text(value).replaceAll("\\", "/").replace(/\/+$/, "");
      const comparablePath = value => {
        const normalized = normalizePath(value);
        return /^[A-Za-z]:\//.test(normalized) || normalized.startsWith("//")
          ? normalized.toLocaleLowerCase()
          : normalized;
      };
      const scopeDetails = scope => ({
        nested: ["Nested project", 0],
        project: ["Project", 1],
        inherited: ["Inherited", 2],
        global: ["Global", 3],
        system: ["System", 4],
        installed: ["Installed only", 5],
        unknown: ["Other", 6]
      })[scope] || ["Other", 6];
      const inferredToolScope = path => {
        const comparable = comparablePath(path);
        const project = comparablePath(state.project);
        if (project && (comparable === project || comparable.startsWith(`${project}/`))) {
          return "inherited";
        }
        if (comparable === "/etc/mise" || comparable.startsWith("/etc/mise/")) return "system";
        if (comparable.includes("/.config/mise/") || comparable.endsWith("/.config/mise")) return "global";
        return "inherited";
      };
      const toolSourceInfo = tool => {
        const path = normalizePath(tool.source);
        if (!path) {
          return {
            key: "installed:",
            path: "",
            scope: "installed",
            tier: "",
            overrideFile: false
          };
        }
        const comparable = comparablePath(path);
        const config = (state.configs || []).find(candidate =>
          comparablePath(candidate.path) === comparable
        );
        return {
          key: `source:${comparable}`,
          path,
          scope: text(config && config.scope) || inferredToolScope(path),
          tier: text(config && config.tier),
          overrideFile: Boolean(config && config.override_file)
        };
      };
      const matches = (...values) => {
        const query = byId("search").value.trim().toLocaleLowerCase();
        return !query || values.some(value => text(value).toLocaleLowerCase().includes(query));
      };
      function table(headers) {
        const result = make("table");
        const head = make("thead");
        const row = make("tr");
        headers.forEach(header => row.append(make("th", "", header)));
        head.append(row);
        result.append(head, make("tbody"));
        return result;
      }
      function renderTasks() {
        const host = byId("tasks");
        host.replaceChildren();
        const tasks = (state.tasks || []).filter(task =>
          matches(task.name, task.description, task.source, ...(task.aliases || []))
        );
        if (!tasks.length) {
          host.append(make("div", "empty", (state.tasks || []).length ? "No matching tasks" : "No Mise tasks found"));
          return;
        }
        const grid = table(["Task", "Description", "Dependencies", "Source", ""]);
        const body = grid.tBodies[0];
        tasks.forEach(task => {
          const row = make("tr");
          const name = make("td", "name", task.name);
          if ((task.aliases || []).length) name.append(make("div", "detail", `Aliases: ${task.aliases.join(", ")}`));
          const dependencies = make("td");
          [...(task.depends || []), ...(task.wait_for || [])].forEach(dep =>
            dependencies.append(make("span", "pill", dep))
          );
          const action = make("td");
          const button = make("button", "run", "Run");
          button.type = "button";
          button.addEventListener("click", () => send({op: "runTask", task: task.name}));
          action.append(button);
          row.append(
            name,
            make("td", "detail", task.description),
            dependencies,
            make("td", "detail", sourceName(task.source)),
            action
          );
          body.append(row);
        });
        host.append(grid);
      }
      function edgeClass(edge) {
        if (edge.missing) return "missing";
        if (edge.kind === "dependsPost") return "depends-post";
        if (edge.kind === "waitFor") return "wait-for";
        return "depends";
      }
      function edgeLabel(edge) {
        if (edge.kind === "dependsPost") return "runs after";
        if (edge.kind === "waitFor") return "waits for";
        return "depends on";
      }
      function graphPositions(nodes, edges) {
        const nodeNames = new Set(nodes.map(node => node.name));
        const cyclic = new Set(nodes.filter(node => node.cyclic).map(node => node.name));
        const levels = new Map(nodes.map(node => [node.name, 0]));
        for (let pass = 0; pass < nodes.length; pass += 1) {
          let changed = false;
          edges.forEach(edge => {
            if (edge.missing || !nodeNames.has(edge.source) || !nodeNames.has(edge.target)) return;
            if (cyclic.has(edge.source) && cyclic.has(edge.target)) return;
            const next = Math.min(nodes.length, (levels.get(edge.target) || 0) + 1);
            if (next > (levels.get(edge.source) || 0)) {
              levels.set(edge.source, next);
              changed = true;
            }
          });
          if (!changed) break;
        }
        const columns = new Map();
        nodes.forEach(node => {
          const level = levels.get(node.name) || 0;
          if (!columns.has(level)) columns.set(level, []);
          columns.get(level).push(node);
        });
        columns.forEach(column => column.sort((left, right) => left.name.localeCompare(right.name)));
        const positions = new Map();
        columns.forEach((column, level) => {
          column.forEach((node, row) => positions.set(node.name, {
            x: 28 + level * 242,
            y: 24 + row * 88
          }));
        });
        return {positions, columns};
      }
      function marker(defs, id, className) {
        const result = makeSvg("marker", {
          id, viewBox: "0 0 10 10", refX: "9", refY: "5",
          markerWidth: "6", markerHeight: "6", orient: "auto-start-reverse"
        });
        result.append(makeSvg("path", {d: "M 0 0 L 10 5 L 0 10 z", class: className}));
        defs.append(result);
      }
      function graphNode(svg, node, position) {
        const missing = Boolean(node.missing);
        const selected = selectedGraphTask === node.name;
        const group = makeSvg("g", {
          class: `graph-node${selected ? " selected" : ""}${node.cyclic ? " cyclic" : ""}${missing ? " missing" : ""}`,
          transform: `translate(${position.x} ${position.y})`,
          tabindex: "0",
          role: "button",
          "aria-label": missing ? `Missing task ${node.name}` : `Select task ${node.name}`
        });
        group.append(makeSvg("rect", {width: "194", height: "62", rx: "7"}));
        const name = makeSvg("text", {x: "12", y: "24", class: "graph-node-name"});
        name.textContent = short(node.name, 23);
        const detail = makeSvg("text", {x: "12", y: "45", class: "graph-node-detail"});
        detail.textContent = missing ? "missing dependency" : node.cyclic ? "dependency cycle" : short(node.description || sourceName(node.source), 27);
        const title = makeSvg("title");
        title.textContent = missing ? `Missing dependency: ${node.name}` : `${node.name}${node.description ? ` — ${node.description}` : ""}`;
        group.append(name, detail, title);
        group.addEventListener("click", () => {
          selectedGraphTask = node.name;
          renderGraph();
        });
        group.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectedGraphTask = node.name;
            renderGraph();
          }
        });
        if (!missing) {
          const run = makeSvg("g", {
            class: "graph-run",
            transform: "translate(169 15)",
            role: "button",
            "aria-label": `Run ${node.name}`
          });
          run.append(
            makeSvg("circle", {cx: "10", cy: "10", r: "10"}),
            makeSvg("path", {d: "M 8 5 L 15 10 L 8 15 z"})
          );
          run.addEventListener("click", event => {
            event.stopPropagation();
            send({op: "runTask", task: node.name});
          });
          group.append(run);
        }
        svg.append(group);
      }
      function renderGraphDetails(host, graph, node) {
        if (!node || node.missing) return;
        const details = make("section", "graph-details");
        const summary = make("div");
        summary.append(
          make("h3", "", node.name),
          make("div", "detail", node.description || "No description"),
          make("div", "detail", sourceName(node.source))
        );
        if (node.cyclic) summary.append(make("div", "problem", "Part of a dependency cycle"));

        const relations = make("div", "graph-relations");
        const outgoing = (graph.edges || []).filter(edge => edge.source === node.name);
        if (!outgoing.length) {
          relations.append(make("div", "detail", "No declared task dependencies"));
        }
        outgoing.forEach(edge => {
          const row = make("div", "graph-relation");
          row.append(
            make("span", `edge-swatch ${edgeClass(edge)}`),
            make("span", "", `${edgeLabel(edge)}:`)
          );
          const target = make("button", "", edge.reference || edge.target);
          target.type = "button";
          target.title = edge.missing ? "This task does not exist" : `Select ${edge.target}`;
          target.addEventListener("click", () => {
            selectedGraphTask = edge.target;
            renderGraph();
          });
          row.append(target);
          if (edge.missing) row.append(make("span", "problem", "(missing)"));
          relations.append(row);
        });

        const run = make("button", "run", "Run task");
        run.type = "button";
        run.addEventListener("click", () => send({op: "runTask", task: node.name}));
        details.append(summary, relations, run);
        host.append(details);
      }
      function renderGraph() {
        const host = byId("graph");
        host.replaceChildren();
        const graph = state.graph || {nodes: [], edges: [], cycles: [], missing: []};
        const realNodes = graph.nodes || [];
        if (!realNodes.length) {
          host.append(make("div", "empty", "No Mise tasks available for the dependency graph"));
          return;
        }
        const missingNodes = (graph.missing || []).map(name => ({
          name, description: "", source: "", cyclic: false, missing: true
        }));
        const nodes = [...realNodes, ...missingNodes];
        if (!selectedGraphTask || !nodes.some(node => node.name === selectedGraphTask)) {
          selectedGraphTask = realNodes[0].name;
        }

        const summary = make("div", "graph-summary");
        summary.append(make("strong", "", `${realNodes.length} tasks`));
        if ((graph.cycles || []).length) {
          summary.append(make("span", "problem", `${graph.cycles.length} dependency cycle${graph.cycles.length === 1 ? "" : "s"}`));
        }
        if ((graph.missing || []).length) {
          summary.append(make("span", "problem", `${graph.missing.length} missing task${graph.missing.length === 1 ? "" : "s"}`));
        }
        if (!(graph.cycles || []).length && !(graph.missing || []).length) {
          summary.append(make("span", "status-ok", "No dependency problems"));
        }
        const legend = make("div", "graph-legend");
        [
          ["depends", "depends on"],
          ["depends-post", "runs after"],
          ["wait-for", "waits for"],
          ["missing", "missing"]
        ].forEach(([kind, label]) => {
          legend.append(make("span", `edge-swatch ${kind}`), make("span", "", label));
        });
        host.append(summary, legend);

        const viewport = make("div", "graph-viewport");
        const {positions, columns} = graphPositions(nodes, graph.edges || []);
        const maxRows = Math.max(...[...columns.values()].map(column => column.length), 1);
        const maxLevel = Math.max(...[...columns.keys()], 0);
        const width = Math.max(720, 250 + maxLevel * 242);
        const height = Math.max(260, 48 + maxRows * 88);
        const svg = makeSvg("svg", {
          width, height, viewBox: `0 0 ${width} ${height}`,
          role: "img", "aria-label": "Mise task dependency graph"
        });
        const defs = makeSvg("defs");
        marker(defs, "arrow-depends", "marker-depends");
        marker(defs, "arrow-depends-post", "marker-depends-post");
        marker(defs, "arrow-wait-for", "marker-wait-for");
        marker(defs, "arrow-missing", "marker-missing");
        svg.append(defs);

        (graph.edges || []).forEach(edge => {
          const source = positions.get(edge.source);
          const target = positions.get(edge.target);
          if (!source || !target) return;
          const startX = source.x;
          const startY = source.y + 31;
          const endX = target.x + 194;
          const endY = target.y + 31;
          const bend = Math.max(38, Math.abs(startX - endX) * .45);
          const kind = edgeClass(edge);
          const path = makeSvg("path", {
            d: `M ${startX} ${startY} C ${startX - bend} ${startY}, ${endX + bend} ${endY}, ${endX} ${endY}`,
            class: `graph-edge ${kind}${edge.missing ? " missing" : ""}`,
            "marker-end": `url(#arrow-${kind})`
          });
          const title = makeSvg("title");
          title.textContent = `${edge.source} ${edgeLabel(edge)} ${edge.reference}`;
          path.append(title);
          svg.append(path);
        });
        nodes.forEach(node => graphNode(svg, node, positions.get(node.name)));
        viewport.append(svg);
        host.append(viewport);
        renderGraphDetails(host, graph, nodes.find(node => node.name === selectedGraphTask));

        if ((graph.cycles || []).length) {
          const cycles = make("div", "errors");
          graph.cycles.forEach(cycle => cycles.append(
            make("div", "error", `Dependency cycle: ${cycle.join(" → ")} → ${cycle[0]}`)
          ));
          host.append(cycles);
        }
      }
      function renderTools() {
        const host = byId("tools");
        host.replaceChildren();
        const tools = state.tools || [];
        if (!tools.length) {
          host.append(make("div", "empty", "No Mise-managed tools found"));
          return;
        }

        const groupsBySource = new Map();
        tools.forEach(tool => {
          const source = toolSourceInfo(tool);
          const group = groupsBySource.get(source.key) || {...source, tools: []};
          group.tools.push(tool);
          groupsBySource.set(source.key, group);
        });
        const groups = [...groupsBySource.values()].sort((left, right) => {
          const leftScope = scopeDetails(left.scope);
          const rightScope = scopeDetails(right.scope);
          return leftScope[1] - rightScope[1]
            || left.path.localeCompare(right.path);
        });

        const groupList = make("div", "tool-groups");
        groups.forEach(group => {
          group.tools.sort((left, right) =>
            text(left.name).localeCompare(text(right.name))
            || Number(Boolean(right.active)) - Number(Boolean(left.active))
            || text(left.version).localeCompare(text(right.version))
          );
          const section = make("section", "tool-group");
          const header = make("div", "tool-group-header");
          const source = make("div", "tool-group-source");
          const title = make("div", "tool-group-title");
          const [scopeLabel] = scopeDetails(group.scope);
          title.append(make("span", `scope-badge ${group.scope}`, scopeLabel));
          if (group.overrideFile) {
            title.append(make("span", "tier-badge", "override"));
          } else if (group.tier) {
            title.append(make("span", "tier-badge", group.tier));
          }
          const path = make(
            "div",
            "tool-group-path",
            group.path || "Installed by Mise but not selected by the current configuration"
          );
          path.title = group.path;
          source.append(title, path);
          const toolNames = new Set(group.tools.map(tool => text(tool.name))).size;
          const versions = group.tools.length;
          const count = versions === toolNames
            ? `${toolNames} tool${toolNames === 1 ? "" : "s"}`
            : `${toolNames} tool${toolNames === 1 ? "" : "s"}, ${versions} versions`;
          header.append(source, make("span", "tool-group-count", count));

          const grid = table(["Tool", "Version", "Requested", "State"]);
          const body = grid.tBodies[0];
          group.tools.forEach(tool => {
            const row = make("tr");
            const status = tool.active ? "Active" : tool.installed ? "Installed" : "Missing";
            row.append(
              make("td", "name", tool.name),
              make("td", "name", tool.version),
              make("td", "detail", tool.requested_version || "—"),
              make("td", tool.active ? "status-ok" : "status-off", status)
            );
            body.append(row);
          });
          section.append(header, grid);
          groupList.append(section);
        });
        host.append(groupList);
      }
      function renderConfiguration() {
        const host = byId("configuration");
        host.replaceChildren();
        const configs = state.configs || [];
        if (!configs.length) {
          host.append(make("div", "empty", "No Mise configuration files reported for this context"));
          return;
        }

        const intro = make("div", "detail");
        intro.style.marginBottom = "10px";
        intro.textContent = "Mise merges these files for the active directory. Task and tool Source columns show which file owns each effective value.";
        const taskSources = new Map();
        const toolSources = new Map();
        (state.tasks || []).forEach(task => {
          const path = text(task.source).replaceAll("\\", "/");
          if (path) taskSources.set(path, (taskSources.get(path) || 0) + 1);
        });
        (state.tools || []).forEach(tool => {
          const path = text(tool.source).replaceAll("\\", "/");
          if (path) toolSources.set(path, (toolSources.get(path) || 0) + 1);
        });

        const grid = table(["Configuration", "Scope", "Tier", "Declared tools", "Effective values"]);
        const body = grid.tBodies[0];
        configs.forEach(config => {
          const path = text(config.path).replaceAll("\\", "/");
          const row = make("tr");
          const name = make("td", "name", sourceName(path));
          name.append(make("div", "detail", path));
          const scope = text(config.scope || "inherited");
          const tier = config.override_file ? "override" : text(config.tier);
          const effective = [];
          const taskCount = taskSources.get(path) || 0;
          const toolCount = toolSources.get(path) || 0;
          if (taskCount) effective.push(`${taskCount} task${taskCount === 1 ? "" : "s"}`);
          if (toolCount) effective.push(`${toolCount} tool${toolCount === 1 ? "" : "s"}`);
          row.append(
            name,
            make("td", "detail", scope),
            make("td", config.override_file ? "status-ok" : "detail", tier || "normal"),
            make("td", "detail", (config.tools || []).join(", ") || "—"),
            make("td", effective.length ? "status-ok" : "detail", effective.join(", ") || "Inherited metadata")
          );
          body.append(row);
        });
        host.append(intro, grid);
      }
      function renderEnvironment() {
        const host = byId("environment");
        host.replaceChildren();
        const environment = state.environment || [];
        if (!environment.length) {
          host.append(make("div", "empty", "No environment changes reported by Mise"));
          return;
        }
        const grid = table(["Variable", "Value", ""]);
        const body = grid.tBodies[0];
        environment.forEach(entry => {
          const row = make("tr");
          const value = make("td", entry.redacted ? "detail" : "name", entry.value);
          value.dataset.environmentName = entry.name;
          const action = make("td");
          if (entry.redacted) {
            const button = make("button", "reveal", "Reveal");
            button.type = "button";
            button.addEventListener("click", () => send({op: "revealEnvironment", name: entry.name}));
            action.append(button);
          }
          row.append(make("td", "name", entry.name), value, action);
          body.append(row);
        });
        host.append(grid);
      }
      function configureTimer() {
        if (timer) clearInterval(timer);
        timer = null;
        const seconds = Number(state.autoRefreshSeconds || 0);
        if (seconds > 0) {
          timer = setInterval(() => {
            if (!document.hidden && !state.loading) requestSnapshot("refresh");
          }, Math.max(10, seconds) * 1000);
        }
      }
      function render() {
        byId("task-count").textContent = `(${(state.tasks || []).length})`;
        byId("tool-count").textContent = `(${(state.tools || []).length})`;
        byId("config-count").textContent = `(${(state.configs || []).length})`;
        byId("env-count").textContent = `(${(state.environment || []).length})`;
        renderTasks();
        renderGraph();
        renderTools();
        renderConfiguration();
        renderEnvironment();
        const errors = byId("errors");
        errors.replaceChildren();
        if (state.trustRequired && !trustDismissed) {
          const prompt = make("div", "trust-prompt");
          const copy = make("div", "trust-copy");
          copy.append(
            make("strong", "", "Trust this project's Mise configuration?"),
            make("span", "detail", "Mise will not load tasks, tools, or environment values until this configuration is trusted.")
          );
          const actions = make("div", "trust-actions");
          const trust = make("button", "trust-action primary", state.loading ? "Trusting…" : "Trust");
          trust.type = "button";
          trust.disabled = state.loading;
          trust.addEventListener("click", () => {
            requestSnapshot("trust", true);
          });
          const cancel = make("button", "trust-action", "Cancel");
          cancel.type = "button";
          cancel.disabled = state.loading;
          cancel.addEventListener("click", () => {
            trustDismissed = true;
            render();
          });
          actions.append(trust, cancel);
          prompt.append(copy, actions);
          errors.append(prompt);
        }
        const messages = state.trustRequired && !trustDismissed
          ? (state.errors || []).filter(error => !error.toLocaleLowerCase().includes("not trusted"))
          : (state.errors || []);
        errors.append(...messages.map(error => make("div", "error", error)));
        const project = sourceName(state.project);
        const normalizedProject = text(state.project).replaceAll("\\", "/").replace(/\/+$/, "");
        const normalizedContext = text(state.context).replaceAll("\\", "/").replace(/\/+$/, "");
        const relativeContext = normalizedContext.startsWith(`${normalizedProject}/`)
          ? normalizedContext.slice(normalizedProject.length + 1)
          : "";
        byId("footer").textContent = state.loading
          ? "Refreshing…"
          : project
            ? `Data from ${project}${relativeContext ? ` / ${relativeContext}` : ""}`
            : "Data from the current project";
        configureTimer();
      }
      function setTab(tab) {
        activeTab = tab;
        document.querySelectorAll(".tab").forEach(button => button.classList.toggle("active", button.dataset.tab === tab));
        ["tasks", "graph", "tools", "configuration", "environment"].forEach(id => byId(id).classList.toggle("hidden", id !== tab));
        byId("search-bar").classList.toggle("hidden", tab !== "tasks");
      }
      function handleMessage(message) {
        let next;
        try {
          next = JSON.parse(message);
          if (next.sessionId != null && next.sessionId !== sessionId) return;
          if (next.sessionId == null && (!state.project || text(next.project) !== state.project)) return;
          const responseRequestId = Number(next.requestId || 0);
          if (responseRequestId && responseRequestId < latestRequestId) return;
          if (next.op === "snapshot") {
            if (state.project !== text(next.project) || !next.trustRequired) trustDismissed = false;
            state = normalizeState(next);
            render();
            setTab(activeTab);
          } else if (next.op === "environmentValue") {
            document.querySelectorAll("[data-environment-name]").forEach(cell => {
              if (cell.dataset.environmentName === next.name) {
                cell.textContent = text(next.value);
                cell.className = "name";
                const button = cell.parentElement.querySelector(".reveal");
                if (button) button.remove();
              }
            });
          } else if (next.op === "runStarted") {
            byId("footer").textContent = `Started ${text(next.task)}`;
          } else if (next.op === "invalidate") {
            if (next.refresh) {
              if (!state.loading) requestSnapshot("refresh");
            } else {
              byId("footer").textContent = "Mise configuration has unsaved changes";
            }
          } else if (next.op === "error") {
            const errors = [...(state.errors || []), text(next.message)];
            state = {...state, loading: false, errors};
            render();
          }
        } catch (error) {
          showFatal(error);
        }
      }
      function initialize() {
        try {
          bridge = globalThis.openidea;
          state = normalizeState({loading: true});
          if (!bridge || typeof bridge.onMessage !== "function") {
            throw new Error("OpenIDEA message bridge is unavailable");
          }
          bridge.onMessage(handleMessage);
          document.querySelectorAll(".tab").forEach(button =>
            button.addEventListener("click", () => setTab(button.dataset.tab))
          );
          byId("search").addEventListener("input", renderTasks);
          byId("refresh").addEventListener("click", () => {
            requestSnapshot("refresh", true);
          });
          render();
          setTab("tasks");
          state.loading = false;
          requestSnapshot("ready", true);
          window.addEventListener("focus", () => requestSnapshot("sync"));
          window.addEventListener("pageshow", () => requestSnapshot("sync"));
          document.addEventListener("visibilitychange", () => {
            if (!document.hidden) requestSnapshot("sync");
          });
        } catch (error) {
          showFatal(error);
        }
      }
      initialize();
    })();
  </script>
</body>
</html>
