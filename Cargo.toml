[package]
name = "openidea-mise"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Mise tasks, tools, environment and run targets for OpenIDEA"
license = "Apache-2.0"
repository = "https://github.com/winlans/openidea-mise"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.45" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
