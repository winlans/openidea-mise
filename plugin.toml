id = "winlans.mise"
name = "Mise"
version = "0.2.0"
description = "Run mise tasks, inspect tools and environment, and execute project runs through mise."
authors = ["winlans <winlans@outlook.com>"]
homepage = "https://github.com/winlans/openidea-mise"
license = "Apache-2.0"
change-notes = "0.2.0 — keep legacy Run Configurations alongside Launch Configurations, add task debugging metadata, improve hierarchy-aware tools and editor support."
categories = ["tools"]
icon = "icons/mise.svg"
engines.openidea = "^1.10"
wasm = "dist/plugin.wasm"
activation = [
  "on-startup-finished",
  "on-view:mise",
  "on-command:*",
  "on-event:file-saved",
  "on-event:files-changed",
  "on-event:settings-changed",
  "on-event:document-changed",
]

[capabilities]
required = ["project.read", "editor.read", "storage", "events"]
optional = ["process:mise"]

[[contributes.commands]]
id = "show"
title = "Mise: Show Tool Window"
category = "Mise"

[[contributes.commands]]
id = "refresh"
title = "Mise: Refresh Project"
category = "Mise"

[[contributes.commands]]
id = "run-task"
title = "Mise: Run Task"
category = "Mise"

[[contributes.views]]
id = "mise"
title = "Mise"
icon = "icons/mise.svg"
location = "bottom"
web = "web/index.html"
header = "none"

[[contributes.runConfigurations]]
files = [
  "mise.toml",
  ".mise.toml",
  "mise.local.toml",
  ".mise.local.toml",
  "mise.dev.toml",
  ".mise.dev.toml",
  "mise.development.toml",
  ".mise.development.toml",
  "mise.test.toml",
  ".mise.test.toml",
  "mise.prod.toml",
  ".mise.prod.toml",
  "mise.production.toml",
  ".mise.production.toml",
  ".tool-versions",
  ".miserc.toml",
]

[[contributes.providers]]
kinds = ["completion", "code-actions", "definition", "hover"]
languages = ["toml"]

[[contributes.providers]]
kinds = ["gutter-actions", "injections"]
languages = ["toml"]

[[contributes.providers]]
kinds = ["document-symbols", "diagnostics", "semantic-tokens"]
languages = ["toml"]

[[contributes.providers]]
kinds = ["completion", "definition", "hover"]
languages = ["shellscript"]

[[contributes.providers]]
kinds = ["gutter-actions", "diagnostics", "semantic-tokens"]
languages = ["shellscript"]

[[contributes.documentIndexers]]
extensions = ["toml", "sh"]

[[contributes.fileIcons]]
id = "mise-config"
icon = "icons/mise.svg"

[[contributes.fileIcons]]
id = "mise-task"
icon = "icons/mise.svg"

[contributes.settings]
title = "Mise"
schema = "settings.schema.json"
