name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1
  OPENIDEA_CLI_VERSION: 0.1.45

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup target add wasm32-wasip2 --toolchain "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"

      - name: Check release versions
        run: python3 scripts/check_versions.py

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run native tests
        run: cargo test --locked

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Build WASI component
        run: cargo build --locked --release --target wasm32-wasip2

      - name: Install OpenIDEA plugin CLI
        run: scripts/install-openidea-plugin.sh

      - name: Build and check plugin
        run: .tools/openidea-plugin build .

      - name: Smoke-test a signed package
        id: package
        run: |
          temporary_directory="$(mktemp -d)"
          trap 'rm -rf "$temporary_directory"' EXIT
          .tools/openidea-plugin keygen "$temporary_directory/publisher.key"
          version="$(python3 scripts/check_versions.py --print-version)"
          OPENIDEA_PLUGIN_BIN=.tools/openidea-plugin \
            OPENIDEA_SIGNING_KEY_FILE="$temporary_directory/publisher.key" \
            scripts/build-package.sh "$version"

      - name: Smoke-test Marketplace registry update
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          temporary_registry="$(mktemp -d)"
          trap 'rm -rf "$temporary_registry"' EXIT
          version="$(python3 scripts/check_versions.py --print-version)"
          first="$(python3 scripts/update_registry.py \
            --registry "$temporary_registry" \
            --version "$version" \
            --package "$PACKAGE_PATH" \
            --sha256 "$PACKAGE_SHA256")"
          second="$(python3 scripts/update_registry.py \
            --registry "$temporary_registry" \
            --version "$version" \
            --package "$PACKAGE_PATH" \
            --sha256 "$PACKAGE_SHA256")"
          test "$first" = "changed=true"
          test "$second" = "changed=false"

      - name: Upload checked plugin component
        uses: actions/upload-artifact@v4
        with:
          name: winlans-mise-wasm
          path: dist/plugin.wasm
          if-no-files-found: error
